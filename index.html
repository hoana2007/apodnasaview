<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA APOD - Dual View Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Octicons/19.8.0/build.css" />
</head>
<body>

  <!-- Header -->
  <header class="gh-header">
    <div class="gh-container header-content">
      <div class="brand">
        <svg class="octicon" height="24" viewBox="0 0 16 16" version="1.1" width="24" fill="currentColor">
          <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
        </svg>
        <span class="repo-title">nasa / <strong>apod-gallery (xem ảnh thiên văn từ NASA)</strong></span>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-icon" title="Đổi giao diện">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="gh-container main-content">
    <div class="Box controls-box">
      <div class="Box-header">
        <h3 class="Box-title">🌌 Khám Phá Vũ Trụ NASA</h3>
      </div>
      <div class="Box-body controls-body">
        <div class="form-group">
          <label for="date-picker">Xem theo ngày:</label>
          <input type="date" id="date-picker" class="form-control" />
        </div>

        <div class="form-group">
          <label for="category-select">Lọc chủ đề:</label>
          <select id="category-select" class="form-control">
            <option value="all">🌐 Tất cả chủ đề</option>
            <option value="galaxy">🌀 Thiên hà (Galaxy)</option>
            <option value="nebula">✨ Tinh vân (Nebula)</option>
            <option value="solar">🪐 Hệ Mặt Trời & Hành tinh</option>
            <option value="earth">🌍 Trái Đất & Bầu trời</option>
          </select>
        </div>

        <button id="btn-reload" class="btn btn-primary">Tải bộ ảnh mới</button>
        <button id="btn-random" class="btn">Ngẫu nhiên 10 ảnh</button>
      </div>
    </div>

    <!-- State Loading -->
    <div id="loading" class="state-container hidden">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu ảnh từ NASA...</p>
    </div>

    <!-- State Error -->
    <div id="error" class="flash flash-error hidden">
      <p id="error-message">Lỗi kết nối API.</p>
    </div>

    <!-- Gallery Grid (2 ảnh/hàng) -->
    <div id="gallery-grid" class="gallery-grid hidden"></div>

    <!-- Thanh Phân Trang -->
    <nav id="pagination" class="pagination-container hidden">
      <button id="btn-prev" class="btn btn-sm">◀ Trang trước</button>
      <span id="page-info" class="page-info">Trang 1 / 1</span>
      <button id="btn-next" class="btn btn-sm">Trang sau ▶</button>
    </nav>
  </main>

  <!-- Modal xem chi tiết -->
  <div id="detail-modal" class="modal-backdrop hidden">
    <div class="Box modal-content">
      <div class="Box-header card-header-flex">
        <div>
          <span id="modal-date" class="Label">YYYY-MM-DD</span>
          <span id="modal-tag" class="Label Label--accent">Tag</span>
          <h2 id="modal-title" class="card-title" style="font-size: 1.2rem; margin-top: 4px;">Title</h2>
        </div>
        <button id="modal-close" class="btn btn-sm btn-icon">✕</button>
      </div>
      <div class="Box-body modal-body">
        <div id="modal-media-container" class="modal-media-wrapper"></div>
        <p id="modal-explanation" class="modal-explanation-text"></p>
      </div>
      <div class="Box-footer modal-footer">
        <button id="modal-download" class="btn btn-primary">⬇️ Tải ảnh HD</button>
        <button id="modal-copy" class="btn">📋 Copy Link</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <!-- Footer -->
  <footer class="gh-footer">
    <div class="gh-container">
      <p>&copy; 2026 - hoana2007 | Ảnh và thông tin từ NASA (https://apod.nasa.gov/apod/astropix.html)</p>
    </div>
  </footer>
</body>
</html>
